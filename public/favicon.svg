<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Executive Shield Linear Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Bevel Light Gradient -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield Crest (Full Size Edge-to-Edge, Transparent Background) -->
  <path d="M32 3 L58 13 C58 38 47 55 32 61 C17 55 6 38 6 13 Z" fill="url(#shieldGrad)"/>

  <!-- Left Facet Highlight for 3D Bevel -->
  <path d="M32 3 L6 13 C6 38 17 55 32 61 Z" fill="url(#bevelLight)"/>

  <!-- Sharp Outer Perimeter Rim -->
  <path d="M32 3 L58 13 C58 38 47 55 32 61 C17 55 6 38 6 13 Z" fill="none" stroke="#60A5FA" stroke-width="2"/>

  <!-- Inner Command Star / Executive Compass -->
  <!-- Center 4-Point Executive Star in Crisp White -->
  <path d="M32 16 L35 27 L46 30 L35 33 L32 44 L29 33 L18 30 L29 27 Z" fill="#FFFFFF"/>
  
  <!-- Star Core Glow -->
  <circle cx="32" cy="30" r="3.5" fill="#38BDF8"/>

  <!-- Security Checkmark Ribbon at Bottom -->
  <path d="M26 44 L30 48 L38 40" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>